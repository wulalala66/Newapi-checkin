name: 维云翻卡 (每4小时)

on:
  # 每 4 小时检查翻卡(charges_max=2, 使用后 7200s 恢复 1 格;翻卡有每日次数上限,
  # 低频定时即可吃满机会,且不会因 GitHub schedule 频率限制被跳过)
  schedule:
    - cron: '0 */4 * * *'
  # 手动触发
  workflow_dispatch:

jobs:
  gwent:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 安装 Playwright 浏览器
        run: playwright install chromium --with-deps

      - name: 确认 Chrome 与 xvfb
        run: |
          google-chrome --version || true
          which xvfb-run || sudo apt-get install -y xvfb || true

      - name: 执行翻卡 (浏览器内过 CF 翻 gwent)
        env:
          CONFIG_URL: ${{ secrets.CONFIG_URL }}
          CONFIG_AUTH: ${{ secrets.CONFIG_AUTH }}
          NEWAPI_ACCOUNTS: ${{ secrets.NEWAPI_ACCOUNTS }}
        run: xvfb-run --auto-servernum python checkin.py --gwent-only